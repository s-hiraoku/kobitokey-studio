schema_version = 1

[template]
name = "web-frontend"
version = 1

[common_harness]
name = "pstack"
ref = "7a583913eb1b8d1a0ee76753d1a2cf072e7b54f9"
skills = ["create-verification-skill", "maintain-verification-skill"]

[target_harness]
name = "kobitokey-studio-web-harness"
version = 1

[spec]
paths = ["docs/specs/kobitokey-studio.md"]
approval_branch = "main"

[delegation]
mode = "observe_only"
allowed_paths = []
forbidden_paths = [".garden/**", "docs/specs/**", ".github/workflows/**"]
max_retries = 0
max_duration_sec = 600
max_cost_usd = 0.0
require_checks = ["toolchain", "frontend_verify"]

[checks.toolchain]
kind = "check"
command = ["node", ".garden/harness/check-toolchain.mjs"]
timeout_sec = 300
covers = ["AC-001"]
required_evidence = ["toolchain-diagnostic.json"]
inconclusive_exit_codes = [75]
status = "active"

[checks.frontend_verify]
kind = "check"
command = ["node", ".garden/harness/verify-frontend.mjs"]
timeout_sec = 300
covers = ["AC-002", "AC-003", "INV-001"]
required_evidence = ["frontend-verify-result.json"]
inconclusive_exit_codes = [75]
status = "active"

[[triggers]]
id = "pr-verify"
event = "pull_request"
flow = "verify_only"
[triggers.conditions]
actions = ["opened", "synchronize"]

[flows.verify_only]
description = "承認済み仕様に基づき、変更を加えずに KobitoKey Studio のツールチェーン・静的解析・テスト・ビルドを検証する"
scope = "all_specs"

[[flows.verify_only.steps]]
id = "check_toolchain"
type = "check"
check = "toolchain"
on_fail = "escalate"
on_inconclusive = "escalate"

[[flows.verify_only.steps]]
id = "check_frontend"
type = "check"
check = "frontend_verify"
on_fail = "escalate"
on_inconclusive = "escalate"

[[flows.verify_only.steps]]
id = "final_gate"
type = "gate"
require_checks = ["toolchain", "frontend_verify"]

[[flows.verify_only.steps]]
id = "emit_report"
type = "report"
kind = "auto"
