name: Browser Firmware Release Check

on:
  pull_request:
    paths:
      - ".github/workflows/browser-firmware-release.yml"
      - "docs/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "wrangler.jsonc"
  push:
    branches:
      - main
      - feature/firmware-mode
    paths:
      - ".github/workflows/browser-firmware-release.yml"
      - "docs/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-firmware-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Release gates
    runs-on: ubuntu-latest
    env:
      BROWSER_FIRMWARE_TMP_DIR: ${{ runner.temp }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/kobitokey-playwright-browsers
      WRANGLER_LOG_PATH: ${{ runner.temp }}/kobitokey-wrangler-logs
      WRANGLER_REGISTRY_PATH: ${{ runner.temp }}/kobitokey-wrangler-registry
      XDG_CONFIG_HOME: ${{ runner.temp }}/kobitokey-xdg-config
      npm_config_cache: ${{ runner.temp }}/kobitokey-npm-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Browser firmware local release check
        run: npm run check:browser-firmware

      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      - name: Browser firmware rendered UI smoke
        run: npm run check:browser-firmware:ui
