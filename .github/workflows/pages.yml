name: Deploy GitHub Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "wrangler.jsonc"
  push:
    branches:
      - main
      - feature/firmware-mode
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "wrangler.jsonc"
  workflow_dispatch:
    inputs:
      deploy_browser_firmware_worker:
        description: "Deploy browser Firmware Mode production Worker after release gates pass"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release-check:
    name: Browser firmware release gates
    runs-on: ubuntu-latest
    env:
      BROWSER_FIRMWARE_TMP_DIR: /tmp/kobitokey-browser-firmware
      PLAYWRIGHT_BROWSERS_PATH: /tmp/kobitokey-playwright-browsers
      WRANGLER_LOG_PATH: /tmp/kobitokey-wrangler-logs
      WRANGLER_REGISTRY_PATH: /tmp/kobitokey-wrangler-registry
      XDG_CONFIG_HOME: /tmp/kobitokey-xdg-config
      npm_config_cache: /tmp/kobitokey-npm-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Browser firmware local release check
        run: npm run check:browser-firmware
      - name: Install Playwright Chromium
        run: npx playwright-core install chromium
      - name: Browser firmware rendered UI smoke
        run: npm run check:browser-firmware:ui

  deploy:
    if: (github.event_name == 'workflow_dispatch' && !inputs.deploy_browser_firmware_worker) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: release-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-browser-firmware-worker:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_browser_firmware_worker
    needs: release-check
    environment:
      name: browser-firmware-production
      url: https://kobitokey-studio.s-hiraoku.workers.dev/?mode=firmware
    runs-on: ubuntu-latest
    env:
      BROWSER_FIRMWARE_TMP_DIR: /tmp/kobitokey-browser-firmware
      BROWSER_FIRMWARE_PREFLIGHT_OAUTH_CLIENT_ID: ${{ secrets.VITE_GITHUB_OAUTH_CLIENT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PLAYWRIGHT_BROWSERS_PATH: /tmp/kobitokey-playwright-browsers
      VITE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.VITE_GITHUB_OAUTH_CLIENT_ID }}
      WRANGLER_LOG_PATH: /tmp/kobitokey-wrangler-logs
      WRANGLER_REGISTRY_PATH: /tmp/kobitokey-wrangler-registry
      XDG_CONFIG_HOME: /tmp/kobitokey-xdg-config
      npm_config_cache: /tmp/kobitokey-npm-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate production Worker secrets
        shell: bash
        run: |
          missing=0
          for name in VITE_GITHUB_OAUTH_CLIENT_ID CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} is required for browser Firmware Mode production Worker deploy"
              missing=1
            fi
          done
          exit "$missing"
      - name: Install dependencies
        run: npm ci
      - name: Deploy browser Firmware Mode Worker
        run: npm run deploy:browser-firmware
