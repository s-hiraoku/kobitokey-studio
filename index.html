<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KobitoKey Studio は KobitoKey の Direct Mode 設定をブラウザから扱うための専用エディタです。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e8a70" />
    <script>
      {
        const preference = localStorage.getItem("kobitokey-color-scheme");
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (preference === "dark" || preference === "light") {
          document.documentElement.dataset.colorScheme = preference;
          if (meta) meta.content = preference;
        }
      }
    </script>
